[workspace]
channels = ["https://prefix.dev/conda-forge"]
name = "pmssm-al-benchmark"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
# Run with the GPU environment of your cluster: `pixi run -e rocm al-gp -- --help`
al-transformer = "python pipelines/active_learning_transformer.py"
al-dnn = "python pipelines/active_learning_dnn.py"
al-gp = "python pipelines/active_learning_gp.py"
al-tabpfn = "python pipelines/active_learning_tabpfn.py"
test = "python tests/test_target_registry.py && python tests/test_model_names.py && python tests/test_models.py"
check = "python tests/check_repo_layout.py"
tutorial = "bash scripts/tutorial/run_tutorial.sh"

# ---------- Shared (vendor-neutral) dependencies ----------
[dependencies]
numpy = ">=2.4.1,<3"
matplotlib = ">=3.10.8,<4"
pip = ">=25.3,<26"
ipykernel = ">=7.1.0,<8"
uproot = ">=5.6.9,<6"
click = ">=8.3.1,<9"
structlog = ">=24.4.0,<25"
pandas = ">=2.2.0,<3"
pyyaml = ">=6.0,<7"
corner = "*"
scikit-learn = "*"
scipy = "*"
seaborn = ">=0.13.2,<0.14"

[pypi-dependencies]
tabpfn = ">=7.1.0"

# ---------- NVIDIA (CUDA) feature ----------
[feature.cuda.dependencies]
pytorch-gpu = "*"
gpytorch = "*"

[feature.cuda.system-requirements]
cuda = "12.6"

# ---------- AMD (ROCm) feature ----------
# conda-forge does not ship ROCm PyTorch, so we install via pip from the
# PyTorch ROCm wheel index.  pytorch-triton-rocm was pulled from PyPI so we
# exclude it from the resolver — it is only needed for torch.compile (custom
# kernel JIT), which we do not use.  With the exclusion we can install the
# current torch 2.7.x / rocm6.3 wheel, which is compatible with ROCm 7.x and
# has gfx942 (MI300A) support.
[feature.rocm.dependencies]
python = ">=3.11,<3.13"

[feature.rocm.pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/rocm6.3"]
find-links = [{path = "stubs/"}]  # stub wheels for pytorch-triton-rocm (pulled from PyPI)
index-strategy = "unsafe-best-match"

[feature.rocm.pypi-dependencies]
torch = ">=2.7.0,<2.8.0"
gpytorch = ">=1.12"

# ---------- Environments ----------
[environments]
cuda = ["cuda"]
rocm = ["rocm"]
